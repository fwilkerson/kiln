name: pages

# Publishes docs/one-page.html as the site's index, at https://fwilkerson.github.io/kiln/. The page is
# self-contained, so the site holds that one file. The repository's Pages source must be GitHub Actions.

on:
  push:
    branches: [main]
    paths: [docs/one-page.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir site && cp docs/one-page.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
