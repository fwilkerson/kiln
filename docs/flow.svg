<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img"
     aria-labelledby="title desc">
  <title id="title">How kiln builds a spec</title>
  <desc id="desc">You shape and approve a spec, then queue it. In kiln fire, a build session writes the code and a
    verify session writes the tests, each in a sandbox. The gate runs your checks, read from main, and an audit
    session reads the work; a failure or finding goes back as a round. The work lands on main as one commit. You try
    it, and kiln accept lists the spec in PRODUCT.md.</desc>
  <style>
    svg {
      --bg: #fbf9f6; --box: #ffffff; --ink: #2b241e; --ink-2: #6f655c; --line: #e2dbd2; --edge: #cfc6bb; --wire: #a89d91;
      --you: #96610f; --agent: #2f62a3; --kiln: #b9501f; --repo: #6a538f; --wall: #e8d6c8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #161412; --box: #1e1b18; --ink: #ece6df; --ink-2: #a39a90; --line: #312c27; --edge: #48413a; --wire: #6d645a;
        --you: #e3b062; --agent: #86ace0; --kiln: #e8865a; --repo: #b4a2d6; --wall: #4a3226;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t { font-size: 13.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: var(--ink-2); }
    .lane { font-size: 11px; font-weight: 600; letter-spacing: .12em; fill: var(--ink-2); }
    .card { fill: var(--bg); stroke: var(--line); }
    .you, .agent, .kiln, .repo { fill: var(--box); stroke: var(--edge); }
    .kiln { stroke: var(--kiln); }
    .you-t { fill: var(--you); }
    .agent-t { fill: var(--agent); }
    .kiln-t { fill: var(--kiln); }
    .repo-t { fill: var(--repo); }
    .w { stroke: var(--wire); fill: none; stroke-width: 1.25; }
    .w-kiln { stroke: var(--kiln); fill: none; stroke-width: 1.25; opacity: .8; }
    .head { fill: var(--wire); }
    .head-kiln { fill: var(--kiln); }
    .chamber { fill: none; stroke: var(--wall); stroke-width: 3; }
    .chamber-line { fill: none; stroke: var(--wall); stroke-width: 3; stroke-linecap: round; }
    .sandbox { fill: none; stroke: var(--edge); stroke-dasharray: 4 4; }
    .glow-stop { stop-color: var(--kiln); }
    .rail { stroke: var(--repo); stroke-width: 2; stroke-linecap: round; opacity: .7; }
    .commit { fill: var(--bg); stroke: var(--repo); stroke-width: 2; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="head-kiln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path class="head-kiln" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop class="glow-stop" offset="0" stop-opacity=".12"/>
      <stop class="glow-stop" offset="1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="card" x=".5" y=".5" width="959" height="409" rx="12"/>

  <!-- You: shape, approve, queue. -->
  <text class="lane you-t" x="24" y="36">YOU</text>
  <rect class="you" x="24" y="52" width="196" height="64" rx="7"/>
  <text class="t mono" x="38" y="76">/shape</text>
  <text class="s" x="38" y="94">writes a spec with you, and</text>
  <text class="s" x="38" y="108">three reviewers read it</text>
  <path class="w" d="M122,116 V140" marker-end="url(#head)"/>
  <rect class="you" x="24" y="144" width="196" height="64" rx="7"/>
  <text class="t" x="38" y="168">approve and commit</text>
  <text class="s" x="38" y="186">Status: Approved, on main:</text>
  <text class="s" x="38" y="200">kiln builds only what main holds</text>
  <path class="w" d="M122,208 V232" marker-end="url(#head)"/>
  <rect class="you" x="24" y="236" width="196" height="50" rx="7"/>
  <text class="t mono" x="38" y="258">kiln queue x</text>
  <text class="t mono" x="38" y="276">kiln fire</text>
  <text class="s" x="24" y="318">then walk away: kiln notifies</text>
  <text class="s" x="24" y="332">you when a build needs you</text>

  <!-- The kiln: an arched chamber, fired from below. -->
  <path class="chamber" d="M258,388 V150 A217,112 0 0 1 692,150 V388"/>
  <rect x="260" y="290" width="430" height="96" fill="url(#glow)"/>
  <path class="chamber-line" d="M258,388 H692"/>
  <text class="t mono kiln-t" x="475" y="78" text-anchor="middle" font-size="16">kiln fire</text>
  <text class="s" x="475" y="96" text-anchor="middle">no one at the keyboard</text>

  <path class="w" d="M220,261 H270" marker-end="url(#head)"/>

  <rect class="sandbox" x="274" y="112" width="134" height="186" rx="8"/>
  <text class="lane agent-t" x="284" y="128" font-size="9.5">SANDBOX</text>
  <rect class="agent" x="284" y="136" width="114" height="64" rx="7"/>
  <text class="t agent-t" x="296" y="158">build</text>
  <text class="s" x="296" y="176">the code, in</text>
  <text class="s" x="296" y="190">its own clone</text>
  <rect class="agent" x="284" y="222" width="114" height="64" rx="7"/>
  <text class="t agent-t" x="296" y="244">verify</text>
  <text class="s" x="296" y="262">the tests, from</text>
  <text class="s" x="296" y="276">the spec alone</text>

  <path class="w" d="M398,168 H418 V210 M398,254 H418 V210 M418,210 H432" marker-end="url(#head)"/>

  <rect class="kiln" x="436" y="178" width="108" height="64" rx="7"/>
  <text class="t kiln-t" x="448" y="200">gate</text>
  <text class="s" x="448" y="218">your checks,</text>
  <text class="s" x="448" y="232">read from main</text>

  <path class="w" d="M544,210 H562" marker-end="url(#head)"/>

  <rect class="agent" x="566" y="178" width="114" height="64" rx="7"/>
  <text class="t agent-t" x="578" y="200">audit</text>
  <text class="s" x="578" y="218">a second session</text>
  <text class="s" x="578" y="232">reads the work</text>

  <path class="w-kiln" d="M490,242 V326 M623,242 V326 H341 V302" stroke-dasharray="4 3" marker-end="url(#head-kiln)"/>
  <text class="s" x="484" y="346" text-anchor="middle">a failure or a finding goes back as a round</text>

  <!-- main: the work lands as one commit, and you take it. -->
  <path class="w" d="M680,210 H758" marker-end="url(#head)"/>
  <text class="lane repo-t" x="770" y="36">MAIN</text>
  <path class="rail" d="M776,50 V388"/>
  <circle class="commit" cx="776" cy="96" r="6"/>
  <circle class="commit" cx="776" cy="142" r="6"/>
  <circle class="commit" cx="776" cy="210" r="11" style="stroke: var(--kiln); stroke-width: 2.5"/>
  <text class="t mono" x="796" y="206">feat(x): land</text>
  <text class="s" x="796" y="222">one commit, gated</text>
  <text class="s" x="796" y="236">and audited</text>
  <path class="w" d="M868,242 V258" marker-end="url(#head)"/>
  <rect class="you" x="796" y="262" width="144" height="56" rx="7"/>
  <text class="t" x="808" y="284">try what landed</text>
  <text class="t mono" x="808" y="304" font-size="12.5">kiln accept x</text>
  <path class="w" d="M868,318 V340" marker-end="url(#head)"/>
  <rect class="repo" x="796" y="344" width="144" height="56" rx="7"/>
  <text class="t mono" x="808" y="366" font-size="12.5">PRODUCT.md</text>
  <text class="s" x="808" y="386">lists the spec</text>
</svg>
